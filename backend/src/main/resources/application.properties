# ===================================================================
# Application
# ===================================================================
spring.application.name=heapvortex-backend

# ===================================================================
# Server
# ===================================================================
server.port=8080

# ===================================================================
# WebSocket
# ===================================================================
# No special properties needed for raw WebSocketHandler (StompJS/SockJS
# would need more config, but GraphStreamHandler uses plain WebSocket)

# ===================================================================
# Jackson (JSON serialization)
# ===================================================================
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non-null

# ===================================================================
# Actuator (useful for exposing basic JVM/health metrics to yourself,
# separate from the custom /api/jvms endpoints)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.infotact.heapvortex_backend=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ===================================================================
# DevTools (auto-restart on code changes)
# ===================================================================
spring.devtools.restart.enabled=true

# ===================================================================
# CORS note:
# Currently handled in WebSocketConfig via setAllowedOrigins("*").
# For REST endpoints, if Elizabeth's React dev server (usually
# localhost:5173 for Vite or localhost:3000 for CRA) gets CORS errors
# hitting /api/jvms, add a WebMvcConfigurer bean rather than a property
# ? see note below.
# ===================================================================